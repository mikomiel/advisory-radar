# Example configuration for advisory-radar.
# Copy to config/config.yml on your volume and edit. Secrets are referenced
# via ${ENV_VAR} and never stored in this file.

# How often sources are polled (ISO 8601 duration-ish; default 15m).
poll_interval: 15m

# Where state is kept inside the container.
state_path: /data/state.json

# Optional: a free NVD API key. NVD admits 5 requests per 30 s anonymously and
# 50 with a key; the per-pass lookup budget is the same either way, so a key
# buys time (about 0.6 s per call instead of 6 s), not breadth.
# Request one at https://nvd.nist.gov/developers/request-an-api-key
# nvd_api_key: ${NVD_API_KEY}

sources:
  - id: nodejs-security
    type: rss
    url: https://nodejs.org/en/feed/vulnerability.xml
  # - id: freshrss
  #   type: freshrss
  #   url: https://freshrss.example.com
  #   token: ${FRESHRSS_TOKEN}
  # - id: page-watches
  #   type: changedetection
  #   url: https://changedetection.example.com
  #   api_key: ${CHANGEDETECTION_API_KEY}
  #   tag: security          # optional: only watches with this tag
  # - id: inbox
  #   type: webhook          # receives POST /webhooks/inbox (set ADVISORY_RADAR_WEBHOOK_SECRET)

# Scope alerts to what you run. Point at a watchlist file (JSON, format in the
# README); without one, every advisory that arrives is judged.
# watchlist: /config/watchlist.json

notifiers:
  - id: discord
    type: discord_webhook
    url: ${DISCORD_WEBHOOK_URL}
  # - id: apprise
  #   type: apprise
  #   url: http://apprise:8000
  #   key: alerts
  #   password: ${APPRISE_PASSWORD}
  # - id: hooks
  #   type: webhook
  #   url: https://hooks.example.com/advisory-radar
  # - id: matrix
  #   type: matrix_webhook
  #   url: ${MATRIX_HOOKSHOT_WEBHOOK}
  # - id: ntfy
  #   type: ntfy
  #   url: https://ntfy.example.com
  #   topic: security-alerts
  # - id: mail
  #   type: smtp
  #   host: smtp.example.com
  #   port: 587
  #   use_tls: true        # STARTTLS on the submission port (587)
  #   from: radar@example.com
  #   to: admin@example.com
  #   username: radar@example.com
  #   password: ${SMTP_PASSWORD}

# Web UI listen address inside the container.
web:
  host: 0.0.0.0
  port: 8080
  # The session auth token is env-only: ADVISORY_RADAR_AUTH_TOKEN.
