[project]
name = "advisory-radar"
version = "0.2.1"
description = "Self-hostable security advisory watcher: configurable sources, CVE enrichment, severity decisions, web UI and multi-channel notifications"
readme = "README.md"
requires-python = ">=3.13,<3.15"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = { text = "MIT" }
authors = [{ name = "Mikołaj Mielczarek" }]
dependencies = [
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
advisory-radar = "advisory_radar.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisory_radar"]

[tool.ruff]
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
