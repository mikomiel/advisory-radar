# Gitleaks configuration for advisory-radar.
# A public repository: the default rule set runs over the whole intended commit range, and a
# finding fails CI. The only exceptions are the two synthetic credential values that
# tests/test_source_admin.py feeds to the product; both match the whole value, so a longer
# credential containing one is still reported. No path is exempt: a credential in a README or
# an example file is found like any other.
title = "advisory-radar gitleaks config"

[extend]
useDefault = true

[allowlist]
  description = "Synthetic credential values used by the test suite, matched in full only"
  regexes = [
    '''^AbCdEf123456$''',
    '''^abcdef1234567890$''',
  ]
