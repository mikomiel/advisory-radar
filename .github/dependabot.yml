version: 2
# Weekly dependency updates for the image's Python dependencies, for the Actions
# this repository runs, and for the container files: the Dockerfile's base images
# and the compose file. Each ecosystem opens at most five pull requests, grouped, so
# the queue stays reviewable; every one of them is a `.github/` or packaging change
# and therefore waits for a human merge under the automerge policy.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      container-images:
        patterns:
          - "*"
    ignore:
      # Hold the runtime image on its current Python minor version. The builder
      # stage's uv image tag pins its own Python, which Dependabot does not bump,
      # so a runtime-only minor bump runs a venv built for another interpreter and
      # the image never answers /healthz (#143, #155). Patch and digest updates
      # still arrive. Move to a new minor in one change that updates both stages,
      # the `requires-python` bound and the CI interpreter matrix together.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      compose-images:
        patterns:
          - "*"
