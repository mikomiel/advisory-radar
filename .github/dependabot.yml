version: 2
# Weekly dependency updates for the image's Python dependencies, for the Actions
# this repository runs, and for the container files: the Dockerfile's base images
# and the compose file. Each ecosystem opens at most five pull requests, grouped, so
# the queue stays reviewable; every one of them is a `.github/` or packaging change
# and therefore waits for a human merge under the automerge policy.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      container-images:
        patterns:
          - "*"
    ignore:
      # Hold the runtime image below Python 3.15. `pyproject.toml` caps
      # `requires-python` at <3.15, and the builder stage's uv image tag pins
      # its own Python, which Dependabot does not bump. Remove this hold in the
      # change that moves both stages, the bound and the CI matrix together.
      - dependency-name: "python"
        versions: [">= 3.15"]
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      compose-images:
        patterns:
          - "*"
