# The review gate: the required `review` status, published from the same rule the merge uses.
#
# GitHub will not let an App approval satisfy the native "require a pull request review" rule (observed on
# this repository: the reviewer App approved #9 at its exact head and GitHub still reported
# REVIEW_REQUIRED / BLOCKED). With one human account that rule would deadlock every maintenance PR, so the
# review is enforced as a *status check* instead: `review` is `success` when the configured reviewer -- or a
# maintainer -- approved this exact head commit, or when the pull request is an exempt dependency update
# (Dependabot, manifest-only paths, no review at all). Every other case is `failure` or `pending`.
#
# What that does and does not guarantee, precisely. A commit status is a stored assertion, not a live query:
# GitHub never expires one, so nothing revokes it when the facts change.
#
#   * Automated merges are exact. automerge.yml re-reads the reviews with the same rule immediately before
#     merging, so a withdrawn approval cannot be merged by the automation.
#   * A *manual* merge relies on the status this workflow published. It is refreshed on lifecycle events
#     (open, ready, close, draft, push) and by a five-minute sweep, so it is current to the last evaluation --
#     not to the moment you click. A green `review` means "approved at this commit when last evaluated".
#     `pull_request_review` is the one event that cannot be used: it runs the pull request's own copy of this
#     file, which a pull request could rewrite to publish its own success. If you withdraw an approval, expect
#     up to five minutes before the status follows.
#
# Fail-closed where it can be: an unreadable review list revokes every success in the snapshot and fails the
# job; an unreadable snapshot publishes nothing and fails. An enumeration failure is the one case this
# workflow cannot repair, and it fails loudly instead of reporting a clean sweep.
name: review-gate

# Trusted triggers only, all of them running this file from the default branch: `workflow_run`, `schedule`,
# and `pull_request_target` for lifecycle events. `pull_request` is deliberately absent -- it runs the head's
# copy, which a pull request could rewrite to publish its own success. `pull_request_target` runs the *base*
# branch's copy with a write token, which is safe here only because this job never checks out or executes
# anything from the pull request: it reads API metadata and runs default-branch scripts.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  # A closed or reused head must not keep a success: without these, a pull request opened on a commit an
  # earlier, approved pull request left behind would inherit its green status.
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed, synchronize]
  schedule:
    - cron: "*/5 * * * *"   # the backstop: a review posted, withdrawn or dismissed turns the status within 5 min

permissions:
  contents: read
  pull-requests: read
  statuses: write      # the whole point: publish the required context on the head commit

concurrency:
  group: review-gate
  cancel-in-progress: false

env:
  # The reviewing identity, matched against the REST representation (the "[bot]" suffix and the user type are
  # what stop a human account with the same name from passing).
  REVIEWER_LOGIN: ecomwizards-gandalf[bot]
  REVIEWER_TYPE: Bot
  #: Reviews by somebody with repository access count too, which is how a maintainer approves a contributor's
  #: pull request the App cannot approve for its own author.
  TRUSTED_ASSOCIATIONS: OWNER,MEMBER,COLLABORATOR
  #: The required status context this workflow publishes.
  GATE_CONTEXT: review

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # The rules are tested scripts on the default branch; this workflow only supplies the API data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish `review` for every open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          #: Empty for workflow_run and schedule; the pull request's head for a lifecycle event.
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          snapshot=$(mktemp)
          plan=$(mktemp)
          trap 'rm -f "$snapshot" "$plan"' EXIT
          : > "$snapshot"

          # Publish only when the verdict changed. GitHub keeps at most 1000 statuses per SHA and context, so a
          # sweep that republished an unchanged verdict would exhaust that in days -- after which the gate could
          # neither approve nor revoke anything on that head.
          publish() {  # <head> <state> <description>
            local head=$1 state=$2 description=${3:0:140} previous
            previous=$(gh api "repos/$REPO/commits/$head/statuses?per_page=100" \
              --jq "[.[] | select(.context == \"$GATE_CONTEXT\")][0] | \"\(.state)\t\(.description)\"" 2>/dev/null || true)
            if [ "$previous" = "$(printf '%s\t%s' "$state" "$description")" ]; then
              echo "$head: $state (unchanged)"
              return 0
            fi
            gh api -X POST "repos/$REPO/statuses/$head" \
              -f state="$state" -f context="$GATE_CONTEXT" -f description="$description" >/dev/null
            echo "$head: $state - $description"
          }

          # Complete enumeration over the REST API: `gh pr list --limit N` truncates silently, and a pull request
          # pushed out of the window would keep an old success that no sweep ever revisits.
          if ! prs=$(gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" \
              --jq '.[] | [.number, .head.sha, .base.sha, (.draft|tostring), .user.login] | @tsv'); then
            echo "::error::cannot enumerate open pull requests; no status can be re-confirmed"
            exit 1
          fi
          if [ -z "$prs" ]; then
            echo "no open pull requests"
            # A closed pull request's head is not in the snapshot, and its status must not survive it.
            if [ -n "${EVENT_HEAD:-}" ]; then
              publish "$EVENT_HEAD" pending "no open pull request carries this commit"
            fi
            exit 0
          fi

          while IFS=$'\t' read -r pr head base draft author; do
            [ -n "$pr" ] || continue
            if ! reviews=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews?per_page=100" | jq -s -c 'add'); then
              # An incomplete snapshot must not leave a success standing: revoke every head we were about to
              # re-confirm, then fail. The next sweep republishes what is true.
              while IFS=$'\t' read -r _other revoke_head _base _draft _author; do
                if [ -n "$revoke_head" ]; then
                  publish "$revoke_head" pending "could not read the reviews; the next run decides" || true
                fi
              done <<<"$prs"
              echo "::error::#${pr}: cannot read the reviews"
              exit 1
            fi
            # The list endpoint does not carry changed_files; the single-pull endpoint does, and the count is
            # what proves the comparison is complete. A failed read stays null, which fails closed.
            if ! changed=$(gh api "repos/$REPO/pulls/$pr" --jq .changed_files); then
              changed=null
              echo "::warning::#${pr}: cannot read the changed-file count; not exempt from review"
            fi
            # The exemption is author *and* path, and the paths come from the immutable two-SHA comparison, never
            # from /pulls/{n}/files (which follows the branch: a head that moved A -> B -> A could show B's
            # harmless files while A is evaluated). Both sides of a rename count. A failed read is not exempt.
            if ! files=$(gh api "repos/$REPO/compare/$base...$head" \
                --jq '[.files[]? | {filename: .filename, previous_filename: .previous_filename}]'); then
              files='[]'
              echo "::warning::#${pr}: cannot read the comparison; not exempt from review"
            fi
            jq -c -n --argjson number "$pr" --arg head "$head" --argjson draft "$draft" --arg author "$author" \
              --argjson changed "$changed" --argjson reviews "$reviews" --argjson files "$files" \
              '{number: $number, head: $head, draft: $draft, author: $author, changed: $changed,
                reviews: $reviews, files: $files}' >> "$snapshot"
          done <<<"$prs"

          # One status per head commit, worst verdict winning: a status is keyed by (sha, context), so two pull
          # requests on the same head must not be able to overrule each other.
          # The snapshot is one JSON object per line; the plan script takes one array.
          jq -s '.' "$snapshot" | python3 scripts/review_gate_plan.py \
            --reviewer "$REVIEWER_LOGIN" --type "$REVIEWER_TYPE" \
            --trusted-associations "$TRUSTED_ASSOCIATIONS" > "$plan"

          while IFS=$'\t' read -r head state description; do
            [ -n "$head" ] || continue
            publish "$head" "$state" "$description"
          done < "$plan"

          # A commit an approved pull request left behind can be reused by a new, unreviewed one: that head is
          # then not in the snapshot and would keep its success. The event names it, so revoke it here.
          if [ -n "${EVENT_HEAD:-}" ] && ! cut -f1 "$plan" | grep -qx "$EVENT_HEAD"; then
            publish "$EVENT_HEAD" pending "no open pull request carries this commit"
          fi
