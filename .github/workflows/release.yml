# Image release: on every v*.*.* tag, build and push to GHCR.
# release-please creates the tag when a maintainer merges its release pull
# request -- that merge is the per-release consent; this workflow builds what the
# tag points at, and only when the tag is a release of main (the first step).
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write      # sign the provenance attestation
  attestations: write  # publish it to the repository

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every branch and tag: origin/main must exist for the ancestry check, and the tag list for `latest`
          # must be complete.
          fetch-depth: 0

      # Anyone who can push a tag starts this job, and the job holds the credentials that publish and sign the
      # image. So the tag is checked before anything is built or pushed: its commit must be on main, and the
      # version in its name must be the version in pyproject.toml, which only the release pull request changes.
      # A repository ruleset that restricts who may create v* tags is the enforcing control and is an owner
      # setting (docs/review-and-merge.md); this step is the check that does not depend on it.
      - name: Verify the release tag
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main is missing from this checkout, so the tag cannot be checked against main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main, or the history that proves it is missing"
            exit 1
          fi
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')" || {
            echo "::error::pyproject.toml carries no [project] version"
            exit 1
          }
          if [[ "${GITHUB_REF_NAME#v}" != "${version}" ]]; then
            echo "::error::${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        # `latest` only for the highest stable vX.Y.Z tag that is a release of main: neither a pre-release
        # (v0.2.0-rc1) nor a rebuild of an older release may move it under every existing deployment, and a stray
        # higher tag that the step above would refuse (a v999.0.0 on a side commit) may not hold it back for good.
        # The order is by version, not by text (v0.10.0 is above v0.9.0). The loop reads a list that is already
        # complete, so that it runs in this shell and its `break` closes no pipe: a pipe into it would lose
        # `highest` in a subshell, and could fail the step under pipefail when the producer is closed early.
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          tags="${repo}:${GITHUB_REF_NAME}"
          # The checks of the step above, for a tag other than the one that started this run: its commit is on main
          # and its name is the version in pyproject.toml at that commit. Whatever fails means "not a release", never
          # an abort. `set -e` does not apply inside a function that an `if` calls, so each command returns on its own.
          release_of_main() {
            local sha version
            sha="$(git rev-parse --verify --quiet "refs/tags/$1^{commit}")" || return 1
            git merge-base --is-ancestor "${sha}" origin/main || return 1
            version="$(git show "${sha}:pyproject.toml" 2>/dev/null | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])' 2>/dev/null)" || return 1
            [[ "${1#v}" == "${version}" ]]
          }
          stable="$(git tag --list 'v*' --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; })"
          highest=""
          while IFS= read -r candidate; do
            [[ -n "${candidate}" ]] || continue
            # This run's own tag passed the step above. A higher one has to pass the same checks to rank.
            if [[ "${candidate}" == "${GITHUB_REF_NAME}" ]] || release_of_main "${candidate}"; then
              highest="${candidate}"
              break
            fi
            echo "${candidate} is not a release of main, so it does not compete for latest"
          done <<< "${stable}"
          if [[ "${GITHUB_REF_NAME}" == "${highest}" ]]; then
            tags="${tags}"$'\n'"${repo}:latest"
          else
            echo "::notice::${GITHUB_REF_NAME} is not the highest stable vX.Y.Z tag that is a release of main (${highest:-none}); latest is left untouched"
          fi
          printf 'list<<TAGS\n%s\nTAGS\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          # The checkout that the first step verified, not the build action's own default Git context, which reads
          # the repository again when it builds.
          context: .
          push: true
          # BuildKit's own provenance and SBOM attestations, in the image manifest. The GitHub attestation
          # below is the independent record: it is signed by this run's identity and can be verified later
          # without trusting the image.
          provenance: true
          sbom: true
          # arm64 matters for self-hosters on Raspberry Pi and Apple Silicon
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bind the published digest to this workflow run, this commit and this repository. The subject is the
      # multi-arch index digest, which is what a deployment pulls. Verify a published image with:
      #   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
