# Image release: on every v*.*.* tag, build and push to GHCR.
# Tag creation is a deliberate operator action (per-release consent); the
# workflow itself just builds what the tag points at.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write      # sign the provenance attestation
  attestations: write  # publish it to the repository

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        # `latest` only for a stable vX.Y.Z tag: a pre-release (v0.2.0-rc1) must not move it under every
        # existing deployment.
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          tags="${repo}:${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags}"$'\n'"${repo}:latest"
          else
            echo "::notice::${GITHUB_REF_NAME} is not a stable vX.Y.Z tag; latest is left untouched"
          fi
          printf 'list<<TAGS\n%s\nTAGS\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          push: true
          # BuildKit's own provenance and SBOM attestations, in the image manifest. The GitHub attestation
          # below is the independent record: it is signed by this run's identity and can be verified later
          # without trusting the image.
          provenance: true
          sbom: true
          # arm64 matters for self-hosters on Raspberry Pi and Apple Silicon
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bind the published digest to this workflow run, this commit and this repository. The subject is the
      # multi-arch index digest, which is what a deployment pulls. Verify a published image with:
      #   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
