# Auto-merge for this repository: an approved, green pull request merges itself.
#
# This is the GitHub-native equivalent of the estate's reviewed-CI automerge executor: the gate is
# "the reviewer approved the exact head" + "every required check is green". Nothing merges without both.
# The reviewer is the Gandalf App (pull request approval), so its approval is what unlocks the merge.
name: automerge

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"   # sweep: pick up approvals whose event we missed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge approved pull requests whose checks are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only pull requests that are open, not drafts, approved, and mergeable.
          candidates=$(gh pr list --repo "$REPO" --state open --base main --limit 50 \
            --json number,reviewDecision,mergeable,isDraft \
            --jq '.[] | select(.isDraft == false and .reviewDecision == "APPROVED" and .mergeable == "MERGEABLE") | .number')

          for pr in $candidates; do
            # Never merge over a red or pending check: auto-merge waits for the rest, a failed one stops us.
            failed=$(gh pr view "$pr" --repo "$REPO" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED")] | length')
            if [ "$failed" != "0" ]; then
              echo "skip #$pr: $failed failing check(s)"
              continue
            fi
            echo "enabling auto-merge for #$pr"
            if gh pr merge "$pr" --repo "$REPO" --auto --squash --delete-branch 2>/dev/null; then
              continue
            fi
            # auto-merge already on, or the branch is up to date and every check is green: merge now.
            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch \
              || echo "skip #$pr: GitHub will not merge it yet (checks pending or review stale)"
          done
