# Auto-merge for this repository: an approved, green pull request merges itself.
#
# This is the GitHub-native equivalent of the estate's reviewed-CI automerge executor. The gate is
# "the reviewer approved *this exact head commit*" + "the required ci check is green on that commit".
# GitHub's branch protection validates both again at merge time; scripts/automerge_loop.py, the script this
# workflow runs, only decides *whether to ask*.
#
# A human decision is required for every change that widens what this automation can reach: a PR touching
# SENSITIVE_PATHS below is never merged here. That is not advisory - the early exit is the enforcement, and
# the repository has exactly one human account, which cannot approve its own pull requests, so a
# "require code owner approval" rule would deadlock maintenance instead of adding a second check.
#
# Enforcement rests on two halves. The script decides from the immutable $base...$head comparison and re-reads
# both refs immediately before merging; branch protection's required status check is **strict** ("require
# branches to be up to date"), so GitHub itself refuses a head whose base advanced. Neither half alone is
# enough: the script cannot see a base advance that GitHub would accept, and strict alone does not know
# which paths are sensitive.
#
# Safety rules this file and its script must keep (see docs in the PR that added it):
#   * never check out or execute pull-request / workflow_run head code - this job only reads PR metadata;
#   * the approving review must be at the current head SHA, by the configured reviewer identity;
#   * the required status context must be present and SUCCESS on that SHA;
#   * branch protection must dismiss stale approvals on new commits (set on main, not by this file).
name: automerge

# Only trusted-default-branch triggers. `pull_request_review` is deliberately absent: that event runs the
# workflow definition from the pull request itself, so a same-repository PR could rewrite this script and
# trigger it with a comment-only review, executing attacker-controlled code with a write token. `workflow_run`,
# `schedule` always runs the default branch's definition. `workflow_dispatch` does not qualify: the dispatcher
# picks the ref, and that ref's copy of this file is what runs. A merge therefore happens when `ci` completes,
# when `review-gate` completes, at a sweep, or on demand - never within the reviewed PR.
on:
  workflow_run:
    # `review-gate` is here so a fresh `review: success` is merged at once instead of on the next sweep: an
    # approval that arrives after `ci` has finished would otherwise wait for a schedule GitHub runs hours late.
    workflows: [ci, review-gate]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"   # sweep: pick up approvals

permissions:
  contents: write        # merge, and delete the head branch the merge leaves behind
  pull-requests: write   # merge, read reviews
  # GitHub closes a pull request's linked issues only for the identity that holds
  # `issues: write`; without it the auto-close is skipped silently and the tracking
  # issue stays open. Nothing here parses the body -- the keywords are GitHub's own.
  issues: write
  checks: read
  statuses: read         # legacy commit-status contexts are invisible without this

concurrency:
  group: automerge
  cancel-in-progress: false

env:
  # The reviewing identity; its approval is the gate. Matched against the REST representation, which carries
  # the "[bot]" suffix, the actor type and a stable numeric id: a human account with the same name cannot pass.
  REVIEWER_LOGIN: ecomwizards-gandalf[bot]
  REVIEWER_TYPE: Bot
  #: Anything that widens what this workflow can reach -- the workflows themselves, this file, the published
  #: artifact with its packaging, and the tests that decide what `ci` accepts -- is listed in
  #: scripts/guard_sensitive_paths.py, where tests/test_guard_sensitive_paths.py pins it. A pull request matching
  #: one of those paths is never auto-merged.
  REQUIRED_CHECK: ci

jobs:
  merge:
    # The only fact the release workflow needs. A sweep that merges nothing
    # leaves it "false", so it costs no release run.
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The guard and approval rules live in tested scripts on the default branch -- the same trust level this
      # workflow already runs at, since it only ever runs from there. No credentials are persisted, so the
      # checkout itself cannot push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge approved pull requests whose required check is green at the same head
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # The loop is scripts/automerge_loop.py, a tested script on the default branch. It owns the `merged` output
        # that the release job reads, and the order of its writes: `false` before the queue is read, `true` at the
        # merge itself, before the branch cleanup and the comment, so that a later failure cannot lose a merge that
        # landed. tests/test_automerge_loop.py runs it against a stub `gh` and pins that order, and
        # tests/test_workflow_pins.py keeps this step nothing but the call.
        run: python3 scripts/automerge_loop.py

  release:
    # Called, not observed: a `workflow_run` trigger on this workflow fired on
    # every completion, merged or not, which cost one release run per sweep and
    # per gate pass. `!cancelled()` lets the release run when the merge job ended
    # red after landing a merge; the output alone still decides.
    needs: merge
    if: ${{ !cancelled() && needs.merge.outputs.merged == 'true' }}
    uses: ./.github/workflows/release-please.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
