name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The secret scan below proves and scans the event's whole commit range. The default
          # one-commit merge checkout would hide a secret added and removed earlier in the branch.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: No internal identifiers (estate guard)
        run: uv run python scripts/check_no_estate_identifiers.py

      - name: Workflow YAML parses
        run: |
          uv run python - <<'PYX'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text())
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          print("\\n".join(bad) or f"{len(list(pathlib.Path('.github/workflows').glob('*.yml')))} workflow file(s) OK")
          sys.exit(1 if bad else 0)
          PYX

      - name: Container image builds and starts
        # A build alone would not have caught a virtualenv relocated to a different path or a data
        # directory the container user cannot write; this starts the image and asks it for /healthz.
        run: |
          set -euo pipefail
          docker build -t advisory-radar:ci .
          tmp=$(mktemp -d)
          mkdir -p "$tmp/config" "$tmp/data"
          printf 'sources: []\nnotifiers: []\nstate_path: /data/state.json\nweb:\n  port: 8080\n' > "$tmp/config/config.yml"
          chmod -R a+rwX "$tmp"
          docker run -d --name radar-ci -p 18080:8080 \
            -v "$tmp/config:/config:ro" -v "$tmp/data:/data" \
            -e ADVISORY_RADAR_AUTH_TOKEN=ci-token advisory-radar:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/healthz
          # the state file must be writable by the container user
          docker exec radar-ci python -c "import pathlib; pathlib.Path('/data/probe').write_text('x')"
          # the runtime image carries the optional PostgreSQL driver, as the non-root user that runs it
          docker exec radar-ci python -c "import psycopg; print(psycopg.__version__)"
          docker logs radar-ci | tail -20
          docker rm -f radar-ci

      - name: Secret scan
        # pinned binary + reviewed digest: the v2 action fails on stderr noise and needs a token for PR scans.
        # The range is proved before the scan: a green result over a clone that cannot see the range is no result.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          config="$PWD/.gitleaks.toml"
          if [ ! -f "$config" ]; then echo "::error::.gitleaks.toml is missing from the checkout"; exit 1; fi

          head=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "::error::pull request base $base is not in the checkout; the full-history fetch did not provide the intended range"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$base" "$head"; then
              echo "::error::pull request base $base is not an ancestor of $head; the intended range cannot be proved"
              exit 1
            fi
            range="$base..$head"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE_SHA"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              range="--all"
            else
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                echo "::error::push base $base is not in the checkout; refusing to fall back to a smaller scan"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$base" "$head"; then
                echo "::error::push base $base is not an ancestor of $head; the intended range cannot be proved"
                exit 1
              fi
              range="$base..$head"
            fi
          else
            range="--all"
          fi

          if [ "$range" = "--all" ]; then
            count=$(git rev-list --count --all)
          else
            count=$(git rev-list --count "$range")
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::the intended commit range $range is empty; refusing to report a scan that covers nothing"
            exit 1
          fi
          echo "secret scan range: $range ($count commits)"

          # Self-test in a throwaway repository: an invented token is added in one commit and removed in
          # the next, so the working tree is clean and only history can reveal it. The scanner must exit 1.
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          git -C "$fixture" init -q
          git -C "$fixture" config user.email "ci@example.invalid"
          git -C "$fixture" config user.name "advisory-radar secret scan self-test"
          token="ghp_$(printf '%s' 'advisory-radar secret-scan self-test' | sha256sum | cut -c1-36)"
          printf 'token: %s\n' "$token" > "$fixture/leak.txt"
          git -C "$fixture" add leak.txt
          git -C "$fixture" commit -q -m "self-test: add synthetic secret"
          git -C "$fixture" rm -q leak.txt
          git -C "$fixture" commit -q -m "self-test: remove synthetic secret"
          set +e
          (cd "$fixture" && /tmp/gitleaks git --config "$config" --redact --log-opts=--all .) >/dev/null 2>"$fixture/gitleaks.log"
          self_code=$?
          set -e
          if [ "$self_code" -ne 1 ]; then
            echo "::error::secret scan self-test exited $self_code, expected 1: gitleaks did not see the commit that removed the secret, so a history scan could not prove the range secret-free"
            cat "$fixture/gitleaks.log"
            exit 1
          fi
          echo "secret scan self-test: the commit that removed the secret was detected"

          set +e
          /tmp/gitleaks git --config "$config" --redact --report-format json --report-path /tmp/gitleaks-report.json --log-opts="$range" . 2>/tmp/gitleaks-stderr.log
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then echo "::error::leaks found in $range"; cat /tmp/gitleaks-report.json; exit 1; fi
          if [ "$code" -ne 0 ]; then echo "::error::gitleaks exited $code"; cat /tmp/gitleaks-stderr.log; exit "$code"; fi
          echo "secret scan clean over $range ($count commits)"

  py314:
    name: py314
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync --frozen --group dev --python 3.14

      - name: Tests
        run: uv run pytest -q

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # No PR comment: the job keeps the read-only workflow token.
          comment-summary-in-pr: never
