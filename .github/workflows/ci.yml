name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: No internal identifiers (estate guard)
        run: uv run python scripts/check_no_estate_identifiers.py

      - name: Workflow YAML parses
        run: |
          uv run python - <<'PYX'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text())
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          print("\\n".join(bad) or f"{len(list(pathlib.Path('.github/workflows').glob('*.yml')))} workflow file(s) OK")
          sys.exit(1 if bad else 0)
          PYX

      - name: Container image builds and starts
        # A build alone would not have caught a virtualenv relocated to a different path or a data
        # directory the container user cannot write; this starts the image and asks it for /healthz.
        run: |
          set -euo pipefail
          docker build -t advisory-radar:ci .
          tmp=$(mktemp -d)
          mkdir -p "$tmp/config" "$tmp/data"
          printf 'sources: []\nnotifiers: []\nstate_path: /data/state.json\nweb:\n  port: 8080\n' > "$tmp/config/config.yml"
          chmod -R a+rwX "$tmp"
          docker run -d --name radar-ci -p 18080:8080 \
            -v "$tmp/config:/config:ro" -v "$tmp/data:/data" \
            -e ADVISORY_RADAR_AUTH_TOKEN=ci-token advisory-radar:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/healthz
          # the state file must be writable by the container user
          docker exec radar-ci python -c "import pathlib; pathlib.Path('/data/probe').write_text('x')"
          docker logs radar-ci | tail -20
          docker rm -f radar-ci

      - name: Secret scan
        # pinned binary + reviewed digest: the v2 action fails on stderr noise and needs a token for PR scans
        run: |
          set -e
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          set +e
          /tmp/gitleaks git --config .gitleaks.toml --redact --report-format json --report-path /tmp/gitleaks-report.json . 2>/tmp/gitleaks-stderr.log
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then echo "::error::leaks found"; cat /tmp/gitleaks-report.json; exit 1; fi
          if [ "$code" -ne 0 ]; then echo "::error::gitleaks exited $code"; cat /tmp/gitleaks-stderr.log; exit "$code"; fi

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # No PR comment: the job keeps the read-only workflow token.
          comment-summary-in-pr: never
