# The review signal: a workflow that does nothing, on purpose.
#
# `pull_request_review` runs the pull request's own copy of the workflow that declares it, so neither
# `review-gate.yml` nor `automerge.yml` may listen for a review directly: a pull request could rewrite that
# copy, and the run would still receive the token its declared permissions grant. This file is safe to run from
# a head because it does nothing -- no checkout, no secrets, no expression that reads the pull request, and
# `permissions: {}`, so the token it receives can act on nothing.
#
# Its only product is a completed run. `workflow_run` starts `review-gate` and `automerge` from the default
# branch when it completes, and those two are where the privileged work happens.
#
# A review posted through the reviewer App's installation token does start this workflow. A status or comment
# written with `GITHUB_TOKEN` would not: GitHub never starts a workflow from an event the repository's own token
# created, which is why the reviewer is a GitHub App and not a workflow.
name: review-signal

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Hand the review event to the default branch
        run: echo "review event relayed to review-gate and automerge"
